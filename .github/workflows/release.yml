name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: rm -rf dist && mkdir -p dist && npm run package

      - name: Locate VSIX
        id: vsix
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.vsix)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one VSIX in dist, found ${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish to VS Code Marketplace
        if: vars.PUBLISH_VSCODE_MARKETPLACE != 'false'
        run: npm exec -- vsce publish --packagePath "${{ steps.vsix.outputs.path }}" --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: vars.PUBLISH_OPEN_VSCODE != 'false'
        run: npm exec -- ovsx publish --skip-duplicate "${{ steps.vsix.outputs.path }}"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Extract release notes from CHANGELOG
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section for this version: from "## VERSION" to
          # the next "## " heading (or EOF).
          BODY="$(awk -v ver="$VERSION" '
            $0 ~ /^## / && found { exit }
            $0 ~ /^## / && $2 == ver { found=1; next }
            found { print }
          ' CHANGELOG.md)"
          # Append standalone artifacts bullet list.
          STANDALONE=""
          STANDALONE+=$'\n'"---"$'\n'
          STANDALONE+=$'\n'"## Standalone CLI artifacts"$'\n'
          STANDALONE+=$'\n'"Prebuilt binaries for all platforms (Node.js 20+ required on the target machine):"$'\n'
          STANDALONE+=$'\n'"- **Linux x64**: \`aiflowbridge-server-linux-x64.tar.gz\`"$'\n'
          STANDALONE+=$'\n'"- **macOS (Apple Silicon) arm64**: \`aiflowbridge-server-darwin-arm64.tar.gz\`"$'\n'
          STANDALONE+=$'\n'"- **macOS (Intel) x64**: \`aiflowbridge-server-darwin-x64.tar.gz\`"$'\n'
          STANDALONE+=$'\n'"- **Windows x64**: \`aiflowbridge-server-win-x64.zip\`"$'\n'
          STANDALONE+=$'\n'"See [docs/standalone.md](https://github.com/LaurentOngaro/aiflowbridge/blob/main/docs/standalone.md) for setup (autostart, API keys, client config)."$'\n'
          printf 'body<<RELEASE_EOF\n%s%s\nRELEASE_EOF\n' "$BODY" "$STANDALONE" >> "$GITHUB_OUTPUT"

      - name: Attach VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.vsix.outputs.path }}
          fail_on_unmatched_files: true
          body: ${{ steps.changelog.outputs.body }}

      - name: Show release info
        run: |
          echo "Released ${{ github.ref_name }}"

  standalone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-13, windows-latest]
    runs-on: ${{ matrix.os }}
    concurrency:
      group: standalone-${{ github.ref_name }}-${{ matrix.os }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build standalone CLI
        run: npm ci && npm run build:standalone

      # FEAT7 + Option 2 of standalone distribution: package the
      # `dist/standalone/` directory plus production-only deps into a
      # platform-specific archive attached to the GitHub Release.
      # End users extract the archive and run `./aiflowbridge-server`
      # (or `.\aiflowbridge-server.cmd` on Windows). Requires Node.js
      # 20+ on the target machine; Node.js is intentionally NOT bundled
      # to keep the artifact size small (~5 MB compiled JS + node_modules
      # vs 80+ MB for a packaged Node runtime).
      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Detect archive extension + asset name
        id: meta
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-latest) ext=zip; arch=win-x64; entry='bin\aiflowbridge-server.cmd' ;;
            macos-latest)    ext=tar.gz; arch=darwin-arm64; entry=bin/aiflowbridge-server ;;
            macos-13)        ext=tar.gz; arch=darwin-x64; entry=bin/aiflowbridge-server ;;
            ubuntu-latest)   ext=tar.gz; arch=linux-x64; entry=bin/aiflowbridge-server ;;
            *)               ext=tar.gz; arch=unknown; entry=bin/aiflowbridge-server ;;
          esac
          echo "ext=$ext" >> "$GITHUB_OUTPUT"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          echo "entry=$entry" >> "$GITHUB_OUTPUT"

      - name: Assemble release tree
        shell: bash
        run: |
          set -euo pipefail
          DEST="release-staging/aiflowbridge-server-${{ steps.meta.outputs.arch }}"
          mkdir -p "$DEST/bin" "$DEST/dist"
          # Copy the compiled standalone output (entry + helper modules).
          cp -r dist/standalone "$DEST/dist/standalone"
          # main.js does `require('../aiflowbridge')` etc. - copy the sibling
          # modules produced by `tsconfig.standalone.json` so the runtime can
          # resolve them from inside dist/standalone/. FAIL FAST if any
          # expected module is missing so we never ship a broken artifact
          # (v2.3.0 was shipped with only dist/standalone/ and broke end
          # users with `Cannot find module '../aiflowbridge'`).
          for module in aiflowbridge logger.js config.js consts.js types.js json.js; do
            if [ ! -e "dist/$module" ]; then
              echo "::error::Standalone build is missing expected sibling module: dist/$module" >&2
              echo "::error::Check tsconfig.standalone.json 'include' and rerun 'npm run build:standalone'." >&2
              exit 1
            fi
            cp -r "dist/$module" "$DEST/dist/$module"
          done
          # Copy only production node_modules (after `npm prune --omit=dev`).
          # `.bin` links are not portable across runners; drop them.
          cp -r node_modules "$DEST/node_modules"
          find "$DEST/node_modules/.bin" -maxdepth 1 -mindepth 1 -delete 2>/dev/null || true
          find "$DEST/node_modules" -name '*.cmd' -delete 2>/dev/null || true
          find "$DEST/node_modules" -name '*.ps1' -delete 2>/dev/null || true
          # Ship a minimal README so the unzipper knows what to do next.
          cat > "$DEST/README.txt" <<EOF
          AIFlowBridge standalone gateway
          =================================
          Version: ${{ github.ref_name }}
          Platform: ${{ steps.meta.outputs.arch }}
          Entry point: ${{ steps.meta.outputs.entry }}
          Documentation: https://github.com/LaurentOngaro/aiflowbridge/blob/main/docs/standalone.md
          EOF

      # Smoke test the staged tree: parse main.js, resolve every relative
      # require, and fail the workflow if any module is missing. This is
      # the regression guard for the v2.3.0 release, which shipped with
      # only `dist/standalone/` and broke every end user with
      # `Cannot find module '../aiflowbridge'`.
      - name: Smoke test standalone bundle
        shell: bash
        run: |
          set -euo pipefail
          DEST="release-staging/aiflowbridge-server-${{ steps.meta.outputs.arch }}"
          node scripts/check-standalone-bundle.js "$DEST/dist/standalone/main.js"

      - name: Write launcher script (POSIX)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          DEST="release-staging/aiflowbridge-server-${{ steps.meta.outputs.arch }}"
          cat > "$DEST/bin/aiflowbridge-server" <<'EOF'
          #!/usr/bin/env bash
          # AIFlowBridge standalone gateway launcher.
          # Resolves the script directory regardless of where it is invoked from
          # (npm install -g, curl | sh, manual copy, ...).
          set -euo pipefail
          HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          ROOT="$(cd "$HERE/.." && pwd)"
          exec node "$ROOT/dist/standalone/main.js" "$@"
          EOF
          chmod +x "$DEST/bin/aiflowbridge-server"

      - name: Write launcher script (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $dest = "release-staging/aiflowbridge-server-${{ steps.meta.outputs.arch }}"
          New-Item -ItemType Directory -Path "$dest/bin" -Force | Out-Null
          @'
          @echo off
          rem AIFlowBridge standalone gateway launcher.
          setlocal
          set "HERE=%~dp0"
          set "ROOT=%HERE%..\"
          node "%ROOT%dist\standalone\main.js" %*
          endlocal
          '@ | Set-Content -LiteralPath "$dest/bin/aiflowbridge-server.cmd" -Encoding ASCII

      - name: Archive (POSIX - tar.gz)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd release-staging
          tar czf "aiflowbridge-server-${{ steps.meta.outputs.arch }}.tar.gz" "aiflowbridge-server-${{ steps.meta.outputs.arch }}/"
          ls -lh "aiflowbridge-server-${{ steps.meta.outputs.arch }}.tar.gz"

      - name: Archive (Windows - zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $stage = "release-staging"
          $dir = Get-Item "$stage\aiflowbridge-server-${{ steps.meta.outputs.arch }}"
          $zip = "$stage\aiflowbridge-server-${{ steps.meta.outputs.arch }}.zip"
          Compress-Archive -Path $dir.FullName -DestinationPath $zip -Force
          Get-ChildItem $zip | Select-Object Name, Length

      - name: Upload standalone binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-staging/aiflowbridge-server-${{ steps.meta.outputs.arch }}.${{ steps.meta.outputs.ext }}
          fail_on_unmatched_files: true