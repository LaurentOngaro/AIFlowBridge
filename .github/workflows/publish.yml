name: Publish to VS Code Marketplace + Open VSX

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: mkdir -p dist && npm run package

      - name: Publish to VS Code Marketplace
        run: |
          npm install -g @vscode/vsce
          vsce publish --pat ${{ secrets.VSCE_PAT }} --packagePath dist/*.vsix

      - name: Publish to Open VSX
        run: |
          # ovsx is a devDependency in package.json, so npm ci above already
          # installed it. Use npx to invoke it without polluting global state.
          # The publisher namespace is read from the "publisher" field in
          # the .vsix's package.json (LaurentOngaro here) - there is no
          # --publisher CLI flag on `ovsx publish`.
          OVSX_PAT=${{ secrets.OVSX_PAT }} npx --no-install ovsx publish \
            --packagePath dist/*.vsix
