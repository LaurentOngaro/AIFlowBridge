# .github/secret_scanning.yml
#
# Configuration for GitHub Secret Scanning push protection.
# https://docs.github.com/en/code-security/secret-scanning/automatically-scanning-secrets-for-known-types/automatically-scanning-secrets-for-push-protection
#
# This repository intentionally ships the public Antigravity CLI OAuth
# client_id and client_secret in `src/aiflowbridge/antigravity/constants.ts`.
# Both credentials are well-known public values distributed inside the
# official Google Antigravity binary - the secret is NOT a private
# credential, it is the same `GOCSPX-...` value any Antigravity CLI user
# can extract from `~/.config/google/antigravity/credentials.json` on
# Linux or `%APPDATA%/Google/Antigravity/credentials.json` on Windows.
#
# Reviewers MUST still treat these two values as the same fixed strings
# shipped by the official Antigravity binary. Operators who want to use
# their own Google Cloud OAuth client can override both values via
# `AIFLOWBRIDGE_GOOGLE_CLIENT_ID` and `AIFLOWBRIDGE_GOOGLE_CLIENT_SECRET`
# environment variables (or the equivalent secrets.json slot for the
# standalone CLI). The BYOK route does not require these credentials.

# Allow `GOCSPX-...` (Google OAuth client secret syntax) inside the
# Antigravity constants file. The same `paths-ignore` also covers any
# future reference to the Antigravity CLI client id (which starts
# with `1071006060591-`).
paths-ignore:
  - 'src/aiflowbridge/antigravity/constants.ts'
  - 'docs/audits/**'
  - '_Private/**'

# Custom patterns for known Antigravity CLI credentials. Listed here so
# the scanner does not raise a separate alert on each push; the
# `paths-ignore` above already exempts the only file that contains them.
# When GitHub adds a `validity-checks: noop` mode, prefer that instead of
# the custom-pattern allow-list.
custom_patterns:
  - id: antigravity-cli-public-oauth-client-id
    description: Antigravity CLI public OAuth client_id (apps.googleusercontent.com)
    pattern: '1071006060591-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com'
    paths-ignore:
      - 'src/aiflowbridge/antigravity/constants.ts'
  - id: antigravity-cli-public-oauth-client-secret
    description: Antigravity CLI public OAuth client_secret (GOCSPX-...)
    pattern: 'GOCSPX-[A-Za-z0-9_-]{20,}'
    paths-ignore:
      - 'src/aiflowbridge/antigravity/constants.ts'
