# .github/secret_scanning.yml
#
# Configuration for GitHub Secret Scanning push protection.
# https://docs.github.com/en/code-security/secret-scanning/automatically-scanning-secrets-for-push-protection
#
# The Antigravity / Cloud Code Assist product OAuth client credentials
# (`client_id` and `client_secret`) that used to be shipped in
# `src/aiflowbridge/antigravity/constants.ts` (that directory has since been
# renamed to `src/aiflowbridge/gemini/`) have been REMOVED from the
# product, along with the transport that used them (see
# `src/aiflowbridge/google-transport-policy.ts`).
#
# The two `paths-ignore` exemptions that existed ONLY for those values
# were removed with them. The remaining exemptions below are unrelated to
# those credentials and are kept.
#
# The custom patterns are deliberately kept WITHOUT any `paths-ignore`
# exemption: they exist to ALERT if a Google OAuth client secret (or the
# Antigravity CLI client id) ever reappears anywhere in the repository,
# including in documentation, tests and archives. A new match is now a
# signal to investigate, not a suppressed known-public value.
#
# Note for reviewers: the BYOK Gemini API route needs no OAuth client
# credentials. It authenticates with the user's own `AIzaSy...` API key,
# which lives in VS Code SecretStorage or `<globalStorageDir>/secrets.json`
# and is never committed.

# Paths excluded from secret scanning entirely. None of these are related
# to a Google OAuth client credential; they are local working-note trees
# and audit archives that never ship to end users.
paths-ignore:
  - 'docs/audits/**'
  - '_Private/**'

custom_patterns:
  - id: google-oauth-client-id-antigravity-shape
    description: Google OAuth client_id (apps.googleusercontent.com) must not be committed
    pattern: '1071006060591-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com'
  - id: google-oauth-client-secret-shape
    description: Google OAuth client_secret (GOCSPX-...) must not be committed
    pattern: 'GOCSPX-[A-Za-z0-9_-]{20,}'